[project]
name = "maa-duel-channel"
version = "0.1.0"
description = "Training pipeline for Arknights Duel Channel outcome prediction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "typer>=0.15",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.20"]
vision = ["ultralytics>=8.3"]
cpu = ["torch>=2.7", "torchvision>=0.22"]
cu128 = ["torch>=2.7", "torchvision>=0.22"]

[project.scripts]
duel = "maa_duel.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maa_duel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
